services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - VITE_USER_SERVICE_URL=${VITE_USER_SERVICE_URL}
      - VITE_PORTFOLIO_SERVICE_URL=${VITE_PORTFOLIO_SERVICE_URL}
      - VITE_AGENT_URL=${VITE_AGENT_URL}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-INFO}
      - VITE_ENVIRONMENT=${VITE_ENVIRONMENT:-development}
